[project]
name = "reason"
version = "0.1.0"
description = "First Order Logic System"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beartype>=0.19.0",
    "lark",
    "matplotlib>=3.10.0",
    "networkx>=3.4.2",
    "numpy>=2.2.2",
    "structlog"
]

[project.scripts]
reason = "reason.scripts.main:main"

[tool.uv.sources]
lark = { path = "repositories/lark" }

[dependency-groups]
dev = [
    "taskipy",
    "jupyter",
    "ipykernel",
    "pytest"
]

[build-system]
# requires = ["hatchling"]
# build-backend = "hatchling.build"
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"


[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.taskipy.tasks]
format = {cmd = "uvx ruff format reason", help = "Format Python code base"}
test = {cmd = 'python -m unittest discover -s tests', help = "Run test"}
